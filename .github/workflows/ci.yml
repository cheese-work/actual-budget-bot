name: CI

# Guards master: every PR into master and every push to master must pass
# typecheck, test, and build before merge/deploy. cd-deploy.yml already
# re-runs typecheck+test on push to master before shipping, but nothing
# gated the PR itself — this is what branch protection requires as a
# status check to block a broken PR from merging.

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
